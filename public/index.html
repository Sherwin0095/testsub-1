<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cicada observability operations dashboard">
  <title>Cicada | Operations dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar">
      <a href="/" class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>cicada<span class="brand-point">.</span></a>
      <div class="workspace">
        <label for="tenant">Workspace</label>
        <select id="tenant" aria-label="Workspace" hidden></select>
        <span id="workspace-name" hidden></span>
      </div>
      <nav aria-label="Operations">
        <div class="nav-label">MONITOR</div>
        <button data-view="overview" class="nav active"><span aria-hidden="true">▦</span> Overview</button>
        <button data-view="incidents" class="nav"><span aria-hidden="true">◇</span> Incidents <small id="nav-incidents" hidden></small></button>
        <button data-view="collectors" class="nav"><span aria-hidden="true">▤</span> Collectors</button>
        <div class="nav-label nav-divider">VERIFY</div>
        <button data-view="evidence" class="nav"><span aria-hidden="true">◷</span> Delivery evidence</button>
        <a id="collector-link" class="nav" target="_blank" rel="noopener"><span aria-hidden="true">⇄</span> Local collector</a>
      </nav>
      <div class="side-bottom">
        <div class="shield" aria-hidden="true">◈</div>
        <div><strong>Metadata-only ingest</strong><small id="side-region">Regional storage</small></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="breadcrumb">Operations <span aria-hidden="true">/</span> <strong id="crumb">Overview</strong></div>
        <div class="top-actions">
          <button class="button clock-button" id="timezone" title="Toggle display timezone">◷ &nbsp; UTC</button>
          <span class="live" id="live" role="status"><i></i> Connecting</span>
        </div>
      </header>
      <div class="page">
        <form id="login" class="panel login" hidden>
          <h1>Sign in to Cicada</h1>
          <label for="token">Workspace viewer token</label>
          <input id="token" type="password" required autocomplete="off">
          <button class="button primary">Sign in</button>
        </form>
        <div id="app" hidden>
          <section class="page-heading">
            <div><p class="eyebrow" id="section-label">FLEET OBSERVABILITY</p><h1 id="title">Operations overview</h1><p id="subtitle">Infrastructure, network and security health across your environments.</p></div>
            <label class="environment-label">Environment<select id="environment" aria-label="Environment"></select></label>
          </section>
          <div id="content"></div>
        </div>
        <p id="message" class="message" role="status" hidden></p>
      </div>
    </main>
  </div>
</body>
</html>
